lm<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live AI Signal</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#080d18;
    color:#fff;
}

.container{
    max-width:480px;
    margin:auto;
    padding:18px;
}

.header{
    text-align:center;
    margin-bottom:18px;
}

.header h1{
    margin:0;
    font-size:30px;
}

.header p{
    color:#9ca3af;
    margin:7px 0 0;
}

.card{
    background:#141b2d;
    border-radius:18px;
    padding:18px;
    margin-bottom:15px;
    box-shadow:0 8px 25px rgba(0,0,0,.25);
}

label{
    display:block;
    color:#aeb7ca;
    margin-bottom:8px;
}

select,
button{
    width:100%;
    padding:14px;
    border-radius:12px;
    font-size:16px;
}

select{
    background:#0b1221;
    color:#fff;
    border:1px solid #30394e;
}

button{
    border:0;
    margin-top:12px;
    background:#2563eb;
    color:#fff;
    font-weight:bold;
}

.market{
    text-align:center;
    color:#60a5fa;
    font-weight:bold;
}

.signal{
    text-align:center;
    font-size:44px;
    font-weight:bold;
    margin:18px 0;
}

.buy{color:#22c55e}
.sell{color:#ef4444}
.wait{color:#f59e0b}

.info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.box{
    background:#0b1221;
    border-radius:12px;
    padding:13px;
    text-align:center;
}

.box small{
    display:block;
    color:#8993a8;
    margin-bottom:6px;
}

.box strong{
    font-size:18px;
}

.timer{
    text-align:center;
    font-size:36px;
    font-weight:bold;
    margin:18px 0 10px;
}

.status{
    text-align:center;
    color:#9ca3af;
    font-size:13px;
}

.history-title{
    margin-top:0;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr 1fr 1fr;
    gap:4px;
    padding:10px 3px;
    border-bottom:1px solid #293247;
    text-align:center;
    font-size:12px;
}

.win{
    color:#22c55e;
    font-weight:bold;
}

.loss{
    color:#ef4444;
    font-weight:bold;
}

.pending{
    color:#f59e0b;
    font-weight:bold;
}

.empty{
    color:#7d879b;
    text-align:center;
    padding:18px;
}

.footer{
    text-align:center;
    color:#667085;
    font-size:12px;
    padding:5px;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
    <h1>Live AI Signal</h1>
    <p>Real Candle Analysis • M1</p>
</div>


<div class="card">

    <label>Select Market</label>

    <select id="symbol">
        <option value="1HZ100V">
            Volatility 100 Index
        </option>
    </select>

    <button onclick="generateSignal()">
        GENERATE LIVE SIGNAL
    </button>

</div>


<div class="card">

    <div class="market">
        DERIV SYNTHETIC LIVE
    </div>

    <div id="signal" class="signal wait">
        WAIT
    </div>

    <div class="info">

        <div class="box">
            <small>PRICE</small>
            <strong id="price">--</strong>
        </div>

        <div class="box">
            <small>STRENGTH</small>
            <strong id="strength">--</strong>
        </div>

        <div class="box">
            <small>BUY SCORE</small>
            <strong id="buyScore">--</strong>
        </div>

        <div class="box">
            <small>SELL SCORE</small>
            <strong id="sellScore">--</strong>
        </div>

    </div>

    <div class="timer">
        <span id="timer">60</span>s
    </div>

    <div id="status" class="status">
        Ready
    </div>

</div>


<div class="card">

<h3 class="history-title">
    Signal History
</h3>

<div class="row">
    <strong>Time</strong>
    <strong>Signal</strong>
    <strong>Entry</strong>
    <strong>Result</strong>
</div>

<div id="history">
    <div class="empty">
        No signals yet
    </div>
</div>

</div>


<div class="card">

<div class="info">

    <div class="box">
        <small>WINS</small>
        <strong id="wins">0</strong>
    </div>

    <div class="box">
        <small>LOSSES</small>
        <strong id="losses">0</strong>
    </div>

    <div class="box">
        <small>SKIPPED</small>
        <strong id="skips">0</strong>
    </div>

    <div class="box">
        <small>WIN RATE</small>
        <strong id="winRate">0%</strong>
    </div>

</div>

</div>


<div class="footer">
    Real data source: Deriv Synthetic Market
</div>

</div>


<script>

/* =================================
   BACKEND
================================= */

const BACKEND_URL =
"https://quotex-otc-backend.onrender.com";


/* =================================
   VARIABLES
================================= */

let currentSignal = null;
let currentEntryPrice = null;

let historyData = [];

let wins = 0;
let losses = 0;
let skips = 0;

let timer = 60;

let checkingResult = false;


/* =================================
   GET CANDLES
================================= */

async function getCandles(){

    const symbol =
        document.getElementById("symbol").value;

    const url =
        BACKEND_URL +
        "/api/v1/candles?symbol=" +
        encodeURIComponent(symbol) +
        "&t=" +
        Date.now();

    const response =
        await fetch(url,{
            cache:"no-store"
        });

    if(!response.ok){

        throw new Error(
            "Backend HTTP " +
            response.status
        );
    }

    const data =
        await response.json();

    if(data.status !== "success"){

        throw new Error(
            data.message ||
            data.error ||
            "Backend error"
        );
    }

    if(
        !Array.isArray(data.candles) ||
        data.candles.length < 20
    ){

        throw new Error(
            "Not enough live candles"
        );
    }

    return data.candles;
}


/* =================================
   EMA
================================= */

function calculateEMA(values, period){

    if(values.length < period)
        return null;

    const multiplier =
        2 / (period + 1);

    let ema = 0;

    for(
        let i = 0;
        i < period;
        i++
    ){

        ema += values[i];
    }

    ema /= period;

    for(
        let i = period;
        i < values.length;
        i++
    ){

        ema =
            (
                values[i] - ema
            ) * multiplier + ema;
    }

    return ema;
}


/* =================================
   RSI
================================= */

function calculateRSI(
    closes,
    period = 14
){

    if(closes.length <= period)
        return 50;

    let gains = 0;
    let lossesValue = 0;

    for(
        let i = 1;
        i <= period;
        i++
    ){

        const change =
            closes[i] -
            closes[i-1];

        if(change > 0)
            gains += change;

        if(change < 0)
            lossesValue += Math.abs(change);
    }

    if(lossesValue === 0)
        return 100;

    const rs =
        gains / lossesValue;

    return 100 -
        (100 / (1 + rs));
}


/* =================================
   ANALYSIS
================================= */

function analyzeCandles(candles){

    const data =
        [...candles].sort(
            (a,b) =>
            Number(a.epoch) -
            Number(b.epoch)
        );


    if(data.length < 20){

        return {
            signal:"WAIT",
            strength:0,
            buyScore:0,
            sellScore:0,
            price:null,
            reason:"Not enough candles"
        };
    }


    const closes =
        data.map(
            c => Number(c.close)
        );


    const c1 =
        data[data.length - 1];

    const c2 =
        data[data.length - 2];

    const c3 =
        data[data.length - 3];


    const o1 = Number(c1.open);
    const h1 = Number(c1.high);
    const l1 = Number(c1.low);
    const x1 = Number(c1.close);

    const o2 = Number(c2.open);
    const x2 = Number(c2.close);

    const o3 = Number(c3.open);
    const x3 = Number(c3.close);


    if(
        !Number.isFinite(o1) ||
        !Number.isFinite(h1) ||
        !Number.isFinite(l1) ||
        !Number.isFinite(x1)
    ){

        return {
            signal:"WAIT",
            strength:0,
            buyScore:0,
            sellScore:0,
            price:null,
            reason:"Invalid candle"
        };
    }


    let buy = 0;
    let sell = 0;


    /* ==============================
       1. LAST CANDLE
    ============================== */

    if(x1 > o1)
        buy += 20;

    if(x1 < o1)
        sell += 20;


    /* ==============================
       2. PREVIOUS CANDLES
    ============================== */

    if(x2 > o2)
        buy += 10;

    if(x2 < o2)
        sell += 10;


    if(x3 > o3)
        buy += 8;

    if(x3 < o3)
        sell += 8;


    /* ==============================
       3. MOMENTUM
    ============================== */

    if(x1 > x2)
        buy += 12;

    if(x1 < x2)
        sell += 12;


    if(x2 > x3)
        buy += 8;

    if(x2 < x3)
        sell += 8;


    /* ==============================
       4. BODY CONFIRMATION
    ============================== */

    const body =
        Math.abs(x1 - o1);

    const range =
        h1 - l1;


    if(range > 0){

        const bodyRatio =
            body / range;


        if(bodyRatio >= 0.65){

            if(x1 > o1)
                buy += 15;

            if(x1 < o1)
                sell += 15;
        }

        else if(bodyRatio >= 0.50){

            if(x1 > o1)
                buy += 8;

            if(x1 < o1)
                sell += 8;
        }
    }


    /* ==============================
       5. EMA TREND
    ============================== */

    const ema9 =
        calculateEMA(
            closes.slice(-30),
            9
        );

    const ema20 =
        calculateEMA(
            closes.slice(-30),
            20
        );


    if(
        ema9 !== null &&
        ema20 !== null
    ){

        if(
            x1 > ema9 &&
            ema9 > ema20
        ){

            buy += 12;
        }


        if(
            x1 < ema9 &&
            ema9 < ema20
        ){

            sell += 12;
        }
    }


    /* ==============================
       6. RSI FILTER
    ============================== */

    const rsi =
        calculateRSI(
            closes.slice(-20),
            14
        );


    if(
        rsi >= 50 &&
        rsi <= 68
    ){

        buy += 8;
    }


    if(
        rsi <= 50 &&
        rsi >= 32
    ){

        sell += 8;
    }


    /* ==============================
       FINAL DECISION
    ============================== */

    const difference =
        Math.abs(
            buy - sell
        );


    let signal = "WAIT";

    let strength = 0;


    /*
       Strong confirmation:
       score >= 60
       difference >= 15
    */

    if(
        buy >= 60 &&
        buy > sell &&
        difference >= 15
    ){

        signal = "BUY";

        strength =
            Math.min(
                Math.round(buy),
                95
            );
    }

    else if(
        sell >= 60 &&
        sell > buy &&
        difference >= 15
    ){

        signal = "SELL";

        strength =
            Math.min(
                Math.round(sell),
                95
            );
    }

    else{

        signal = "WAIT";

        strength =
            Math.min(
                Math.round(
                    Math.max(
                        buy,
                        sell
                    )
                ),
                59
            );
    }


    return {

        signal:signal,

        strength:strength,

        buyScore:Math.round(buy),

        sellScore:Math.round(sell),

        price:x1,

        candleTime:
            c1.epoch || null,

        rsi:
            Number(rsi.toFixed(1)),

        ema9:
            ema9 !== null
            ? Number(ema9.toFixed(2))
            : null,

        ema20:
            ema20 !== null
            ? Number(ema20.toFixed(2))
            : null
    };
}


/* =================================
   GENERATE SIGNAL
================================= */

async function generateSignal(){

    const status =
        document.getElementById(
            "status"
        );

    status.innerText =
        "Analyzing live candles...";


    try{

        const candles =
            await getCandles();


        const result =
            analyzeCandles(
                candles
            );


        updateSignal(
            result
        );


        status.innerText =
            "Live analysis completed";


    }catch(error){

        console.error(error);

        document.getElementById(
            "signal"
        ).innerText =
            "ERROR";

        document.getElementById(
            "signal"
        ).className =
            "signal wait";

        status.innerText =
            error.message;
    }
}


/* =================================
   UPDATE UI
================================= */

function updateSignal(result){

    const signalElement =
        document.getElementById(
            "signal"
        );


    signalElement.innerText =
        result.signal;


    signalElement.className =
        "signal " +
        (
            result.signal === "BUY"
            ? "buy"
            :
            result.signal === "SELL"
            ? "sell"
            : "wait"
        );


    document.getElementById(
        "price"
    ).innerText =
        result.price !== null
        ? Number(
            result.price
          ).toFixed(2)
        : "--";


    document.getElementById(
        "strength"
    ).innerText =
        result.strength + "%";


    document.getElementById(
        "buyScore"
    ).innerText =
        result.buyScore;


    document.getElementById(
        "sellScore"
    ).innerText =
        result.sellScore;


    /*
       Only save actual signals.
    */

    if(
        result.signal === "BUY" ||
        result.signal === "SELL"
    ){

        currentSignal =
            result.signal;

        currentEntryPrice =
            Number(result.price);


        addHistory({

            time:
                new Date()
                .toLocaleTimeString(),

            signal:
                result.signal,

            entry:
                currentEntryPrice,

            result:
                "PENDING"
        });
    }
}


/* =================================
   HISTORY
================================= */

function addHistory(item){

    historyData.unshift(item);


    if(historyData.length > 20){

        historyData =
            historyData.slice(
                0,
                20
            );
    }


    renderHistory();
}


function renderHistory(){

    const box =
        document.getElementById(
            "history"
        );


    if(historyData.length === 0){

        box.innerHTML =
            '<div class="empty">No signals yet</div>';

        return;
    }


    box.innerHTML =
        historyData
        .map(item => {

            let cls =
                "pending";


            if(item.result === "WIN")
                cls = "win";


            if(item.result === "LOSS")
                cls = "loss";


            return `

            <div class="row">

                <span>
                    ${item.time}
                </span>

                <span class="${
                    item.signal === "BUY"
                    ? "win"
                    : "loss"
                }">
                    ${item.signal}
                </span>

                <span>
                    ${Number(
                        item.entry
                    ).toFixed(2)}
                </span>

                <span class="${cls}">
                    ${item.result}
                </span>

            </div>

            `;
        })
        .join("");
}


/* =================================
   CHECK RESULT
================================= */

async function checkSignalResult(){

    if(
        checkingResult ||
        !currentSignal ||
        currentEntryPrice === null
    ){

        return;
    }


    checkingResult = true;


    try{

        const candles =
            await getCandles();


        const data =
            [...candles].sort(
                (a,b) =>
                Number(a.epoch) -
                Number(b.epoch)
            );


        if(data.length < 2)
            return;


        const latest =
            data[data.length - 1];


        const exitPrice =
            Number(
                latest.close
            );


        if(
            !Number.isFinite(
                exitPrice
            )
        ){

            return;
        }


        const result =
            checkResult(
                currentSignal,
                currentEntryPrice,
                exitPrice
            );


        if(result === "WIN")
            wins++;

        if(result === "LOSS")
            losses++;

        if(result === "SKIP")
            skips++;


        if(historyData.length > 0){

            historyData[0].result =
                result;

            historyData[0].exit =
                exitPrice;
        }


        updateStats();

        renderHistory();


        currentSignal = null;

        currentEntryPrice = null;


    }catch(error){

        console.log(
            "Result error:",
            error.message
        );

    }finally{

        checkingResult = false;
    }
}


/* =================================
   WIN / LOSS
================================= */

function checkResult(
    signal,
    entry,
    exit
){

    if(signal === "BUY"){

        return exit > entry
            ? "WIN"
            : "LOSS";
    }


    if(signal === "SELL"){

        return exit < entry
            ? "WIN"
            : "LOSS";
    }


    return "SKIP";
}


/* =================================
   STATS
================================= */

function updateStats(){

    document.getElementById(
        "wins"
    ).innerText = wins;


    document.getElementById(
        "losses"
    ).innerText = losses;


    document.getElementById(
        "skips"
    ).innerText = skips;


    const total =
        wins + losses;


    const rate =
        total > 0
        ? (
            wins / total
          ) * 100
        : 0;


    document.getElementById(
        "winRate"
    ).innerText =
        rate.toFixed(1) + "%";
}


/* =================================
   TIMER
================================= */

function startTimer(){

    setInterval(async () => {

        timer--;

        document.getElementById(
            "timer"
        ).innerText =
            timer;


        if(timer <= 0){

            /*
              Check previous signal
            */

            await checkSignalResult();


            /*
              Generate next signal
            */

            await generateSignal();


            timer = 60;

            document.getElementById(
                "timer"
            ).innerText =
                timer;
        }

    },1000);
}


/* =================================
   START
================================= */

window.addEventListener(
    "load",
    () => {

        updateStats();

        startTimer();

        generateSignal();

    }
);

</script>

</body>
</html>
