<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quotex OTC Live Signal</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b1020;
    color: #ffffff;
    font-family: Arial, sans-serif;
}

.container {
    width: 100%;
    max-width: 520px;
    margin: auto;
    padding: 15px;
}

h1 {
    text-align: center;
    color: #00e5ff;
    font-size: 24px;
}

.card {
    background: #151c32;
    padding: 18px;
    margin-top: 15px;
    border-radius: 15px;
}

label {
    display: block;
    color: #aaa;
    margin-bottom: 8px;
}

select,
button {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 10px;
    font-size: 16px;
}

select {
    background: #222b45;
    color: white;
}

button {
    margin-top: 12px;
    background: #00c853;
    color: white;
    font-weight: bold;
}

button:disabled {
    background: #555;
}

.status {
    text-align: center;
    margin-top: 12px;
    font-weight: bold;
}

.signal {
    text-align: center;
    font-size: 42px;
    font-weight: bold;
    margin: 20px 0;
}

.buy {
    color: #00e676;
}

.sell {
    color: #ff1744;
}

.wait {
    color: #ffc107;
}

.info {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.box {
    background: #202941;
    padding: 12px;
    border-radius: 10px;
    text-align: center;
}

.value {
    font-size: 20px;
    font-weight: bold;
    margin-top: 5px;
}

.timer {
    text-align: center;
    color: #00e5ff;
    font-size: 28px;
    margin-top: 15px;
}

.clock {
    text-align: center;
    font-size: 18px;
}

.error {
    margin-top: 12px;
    padding: 10px;
    border-radius: 8px;
    background: #30151a;
    color: #ff8a8a;
    font-size: 13px;
    word-break: break-word;
    display: none;
}

.history {
    max-height: 350px;
    overflow-y: auto;
}

.history-item {
    background: #202941;
    padding: 12px;
    margin-bottom: 8px;
    border-radius: 9px;
    font-size: 13px;
}

.small {
    text-align: center;
    color: #888;
    font-size: 12px;
    margin-top: 15px;
}
</style>
</head>

<body>

<div class="container">

<h1>📊 Quotex OTC Live Signal</h1>

<div class="card">

<label>OTC Pair</label>

<select id="pair">

<option value="AUDNZD_otc">AUD/NZD (OTC)</option>
<option value="GBPNZD_otc">GBP/NZD (OTC)</option>
<option value="NZDCAD_otc">NZD/CAD (OTC)</option>
<option value="NZDUSD_otc">NZD/USD (OTC)</option>
<option value="USDBRL_otc">USD/BRL (OTC)</option>
<option value="USDDZD_otc">USD/DZD (OTC)</option>
<option value="USDEGP_otc">USD/EGP (OTC)</option>
<option value="USDNGN_otc">USD/NGN (OTC)</option>
<option value="USDCOP_otc">USD/COP (OTC)</option>
<option value="USDBDT_otc">USD/BDT (OTC)</option>
<option value="USDPHP_otc">USD/PHP (OTC)</option>

</select>

<button id="generateBtn">
GENERATE LIVE SIGNAL
</button>

<div id="status" class="status">
READY
</div>

<div id="signal" class="signal wait">
WAIT
</div>

<div class="info">

<div class="box">
PRICE
<div id="price" class="value">--</div>
</div>

<div class="box">
STRENGTH
<div id="strength" class="value">--</div>
</div>

</div>

<div class="timer">
Next Signal: <span id="timer">60</span>s
</div>

<div id="errorBox" class="error"></div>

</div>


<div class="card">

<h3>🇮🇳 Indian Time</h3>

<div id="clock" class="clock">
--
</div>

</div>


<div class="card">

<h3>📜 Signal History</h3>

<div id="history" class="history">
No signals yet
</div>

</div>


<div class="small">
Real OTC candle data only • No fake signals
</div>

</div>


<script>

/* ==============================
   BACKEND
============================== */

const BACKEND_URL =
    "https://quotex-otc-backend.onrender.com";


/* ==============================
   VARIABLES
============================== */

let timerValue = 60;
let timerInterval = null;
let requestRunning = false;

let historyData =
    JSON.parse(
        localStorage.getItem("otcSignalHistory") || "[]"
    );


/* ==============================
   ELEMENTS
============================== */

const pairElement =
    document.getElementById("pair");

const generateBtn =
    document.getElementById("generateBtn");

const statusElement =
    document.getElementById("status");

const signalElement =
    document.getElementById("signal");

const priceElement =
    document.getElementById("price");

const strengthElement =
    document.getElementById("strength");

const timerElement =
    document.getElementById("timer");

const errorBox =
    document.getElementById("errorBox");

const historyElement =
    document.getElementById("history");


/* ==============================
   INDIAN CLOCK
============================== */

function updateClock() {

    const now = new Date();

    const text =
        now.toLocaleString("en-IN", {
            timeZone: "Asia/Kolkata",
            dateStyle: "medium",
            timeStyle: "medium"
        });

    document.getElementById("clock")
        .textContent = text;
}

updateClock();

setInterval(updateClock, 1000);


/* ==============================
   SHOW ERROR
============================== */

function showError(message) {

    errorBox.style.display = "block";

    errorBox.textContent =
        "Backend: " + message;
}


/* ==============================
   HIDE ERROR
============================== */

function hideError() {

    errorBox.style.display = "none";

    errorBox.textContent = "";
}


/* ==============================
   SET WAIT
============================== */

function setWait() {

    signalElement.textContent = "WAIT";

    signalElement.className =
        "signal wait";
}


/* ==============================
   SIGNAL ANALYSIS
============================== */

function calculateSignal(candles) {

    if (!Array.isArray(candles)) {
        return {
            signal: "WAIT",
            strength: 0
        };
    }

    if (candles.length < 3) {
        return {
            signal: "WAIT",
            strength: 0
        };
    }


    const c1 =
        candles[candles.length - 1];

    const c2 =
        candles[candles.length - 2];

    const c3 =
        candles[candles.length - 3];


    const close1 =
        Number(c1.close);

    const open1 =
        Number(c1.open);

    const close2 =
        Number(c2.close);

    const open2 =
        Number(c2.open);

    const close3 =
        Number(c3.close);

    const open3 =
        Number(c3.open);


    if (
        !Number.isFinite(close1) ||
        !Number.isFinite(open1) ||
        !Number.isFinite(close2) ||
        !Number.isFinite(open2) ||
        !Number.isFinite(close3) ||
        !Number.isFinite(open3)
    ) {
        return {
            signal: "WAIT",
            strength: 0
        };
    }


    let buyScore = 0;
    let sellScore = 0;


    /* Current candle */

    if (close1 > open1) {
        buyScore += 2;
    }

    if (close1 < open1) {
        sellScore += 2;
    }


    /* Previous candle */

    if (close2 > open2) {
        buyScore += 1;
    }

    if (close2 < open2) {
        sellScore += 1;
    }


    /* Third candle */

    if (close3 > open3) {
        buyScore += 1;
    }

    if (close3 < open3) {
        sellScore += 1;
    }


    let signal = "WAIT";
    let strength = 0;


    if (buyScore > sellScore) {

        signal = "BUY";

        strength =
            Math.round(
                (buyScore / 4) * 100
            );

    }
    else if (sellScore > buyScore) {

        signal = "SELL";

        strength =
            Math.round(
                (sellScore / 4) * 100
            );

    }


    return {
        signal: signal,
        strength: Math.min(strength, 100)
    };
}


/* ==============================
   GENERATE SIGNAL
============================== */

async function generateSignal() {

    if (requestRunning) {
        return;
    }

    requestRunning = true;

    generateBtn.disabled = true;

    hideError();

    statusElement.textContent =
        "CONNECTING...";

    setWait();

    priceElement.textContent = "--";

    strengthElement.textContent = "--";


    const pair =
        pairElement.value;


    try {

        const url =
            BACKEND_URL +
            "/api/v1/candles?symbol=" +
            encodeURIComponent(pair);


        const response =
            await fetch(url, {
                method: "GET",
                cache: "no-store"
            });


        let data;

        try {

            data =
                await response.json();

        }
        catch {

            throw new Error(
                "Backend returned invalid JSON"
            );
        }


        console.log(
            "OTC Backend:",
            data
        );


        if (!response.ok) {

            throw new Error(
                data.message ||
                data.error ||
                "HTTP " + response.status
            );
        }


        if (
            data.status !== "success" &&
            data.connection !== "CONNECTED"
        ) {

            throw new Error(
                data.message ||
                data.error ||
                "OTC data unavailable"
            );
        }


        const candles =
            Array.isArray(data.candles)
                ? data.candles
                : [];


        if (candles.length < 3) {

            throw new Error(
                "Not enough real OTC candles"
            );
        }


        const latest =
            candles[candles.length - 1];


        if (
            latest &&
            latest.close !== undefined &&
            latest.close !== null
        ) {

            priceElement.textContent =
                latest.close;
        }


        const result =
            calculateSignal(candles);


        statusElement.textContent =
            "OTC LIVE";


        strengthElement.textContent =
            result.strength + "%";


        if (result.signal === "BUY") {

            signalElement.textContent =
                "BUY";

            signalElement.className =
                "signal buy";

            addHistory(
                pair,
                "BUY",
                latest.close,
                result.strength
            );

        }
        else if (result.signal === "SELL") {

            signalElement.textContent =
                "SELL";

            signalElement.className =
                "signal sell";

            addHistory(
                pair,
                "SELL",
                latest.close,
                result.strength
            );

        }
        else {

            setWait();

            statusElement.textContent =
                "OTC LIVE - WAIT";
        }


    }
    catch (error) {

        console.error(
            "OTC Signal Error:",
            error
        );


        statusElement.textContent =
            "OFFLINE";

        setWait();

        priceElement.textContent =
            "--";

        strengthElement.textContent =
            "--";


        showError(
            error.message ||
            "Unable to receive OTC data"
        );

    }
    finally {

        requestRunning = false;

        generateBtn.disabled = false;
    }
}


/* ==============================
   HISTORY
============================== */

function addHistory(
    pair,
    signal,
    entry,
    strength
) {

    const item = {

        pair: pair,

        signal: signal,

        entry: entry,

        strength: strength,

        time: new Date().toISOString()
    };


    historyData.unshift(item);


    if (historyData.length > 20) {

        historyData =
            historyData.slice(0, 20);
    }


    localStorage.setItem(
        "otcSignalHistory",
        JSON.stringify(historyData)
    );


    renderHistory();
}


/* ==============================
   RENDER HISTORY
============================== */

function renderHistory() {

    if (!historyData.length) {

        historyElement.textContent =
            "No signals yet";

        return;
    }


    historyElement.innerHTML =
        historyData.map(item => {

            const time =
                new Date(item.time)
                .toLocaleTimeString(
                    "en-IN",
                    {
                        timeZone:
                            "Asia/Kolkata"
                    }
                );


            return `
                <div class="history-item">

                    <b>${item.pair}</b><br>

                    Signal:
                    <b>${item.signal}</b><br>

                    Entry:
                    ${item.entry ?? "--"}<br>

                    Strength:
                    ${item.strength ?? 0}%<br>

                    Time:
                    ${time}

                </div>
            `;

        }).join("");
}


renderHistory();


/* ==============================
   BUTTON
============================== */

generateBtn.addEventListener(
    "click",
    generateSignal
);


/* ==============================
   TIMER
============================== */

function startTimer() {

    clearInterval(timerInterval);

    timerValue = 60;

    timerElement.textContent =
        timerValue;


    timerInterval =
        setInterval(() => {

            timerValue--;

            timerElement.textContent =
                timerValue;


            if (timerValue <= 0) {

                timerValue = 60;

                generateSignal();
            }

        }, 1000);
}


startTimer();


/* ==============================
   FIRST LOAD
============================== */

generateSignal();

</script>

</body>
</html>
